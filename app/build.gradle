plugins {
    id 'com.android.application'
}

android {
    namespace 'com.local.anynight'
    compileSdk 35

    defaultConfig {
        applicationId "com.local.anynight"
        minSdk 30
        targetSdk 35
        versionCode 29
        versionName "1.9.4"
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
