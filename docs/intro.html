<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>AnyNight</title>
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#F4F3EF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no,email=no,address=no">
<meta name="full-screen" content="yes">
<meta name="x5-fullscreen" content="true">
<meta name="x5-page-mode" content="app">
<meta name="browsermode" content="application">
<style>
  html,body{margin:0;padding:0;height:100%;width:100%;background:#F4F3EF;overflow:hidden;}
  body{position:fixed;left:0;top:0;right:0;bottom:0;-webkit-tap-highlight-color:transparent;
       touch-action:none;-webkit-user-select:none;user-select:none;overscroll-behavior:none;}
  #c{display:block;position:absolute;left:0;top:0;}
  /* 点一下才开始：iOS 只在用户手势里允许全屏，所以需要一个手势入口 */
  #tap{position:absolute;left:0;top:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;
       background:transparent;opacity:0;pointer-events:none;transition:opacity .45s ease;}
  #tap.show{opacity:1;pointer-events:auto;}
  #tap .g{width:60px;height:60px;border-radius:50%;border:1px solid rgba(35,35,42,.28);
          display:flex;align-items:center;justify-content:center;}
  #tap .g i{display:block;width:0;height:0;margin-left:4px;
            border-top:7px solid transparent;border-bottom:7px solid transparent;
            border-left:11px solid rgba(35,35,42,.42);}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="tap"><div class="g"><i></i></div></div>
<script>
(() => {
  const W = 390, H = 844;                 // 设计稿尺寸（构图基准）
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  let dpr = 1, VW = W, VH = H;

  // 跟随视口：微信 X5 / iOS WebView 里 innerHeight 会随工具栏变化，所以要跟着 resize 重排
  function layout(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    VW = Math.max(1, Math.round(window.innerWidth));
    VH = Math.max(1, Math.round(window.innerHeight));
    cv.width = Math.round(VW * dpr); cv.height = Math.round(VH * dpr);
    cv.style.width = VW + 'px'; cv.style.height = VH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (typeof render === 'function') render();
  }

  // ---------- 配色：只有两套 ----------
  const LIGHT_BG='#F4F3EF', LIGHT_INK='#23232A', LIGHT_SUB='#7A7A72';
  const DARK_BG ='#121214', DARK_INK ='#EDEAE4', DARK_SUB ='#8D8B85';

  // ---------- 全片统一线宽 / 统一字号 ----------
  const LW = 2;          // 结构线：统一、细
  const BW = 1.5;        // 窗口外壳描边：更淡
  const FS = 24;

  // ---------- 窗口位置：统一挪到屏幕下方的空白区，并在其中居中 ----------
  const WIN_W = 152, WIN_H = 250;
  const LOWER_TOP = 336;                                   // 幕一/幕二：文字下方即空白区起点
  const lowerY = hh => LOWER_TOP + (H - LOWER_TOP - hh) / 2; // 在下方空白区里居中
  const WIN_X  = (W - WIN_W) / 2;                          // 单窗居中
  const WIN1_Y = lowerY(WIN_H);                            // 幕一 / 幕二
  const A3_GAP = 18;                                       // 幕三两窗横距
  const A3_X   = (W - (WIN_W * 2 + A3_GAP)) / 2;           // 幕三两窗整体居中
  const A3_STAGGER = 40;                                   // 幕三两窗竖向错落
  const A3_TEXT_BOT = 314;                                 // 幕三文字底部
  const A3_Y = A3_TEXT_BOT + (H - A3_TEXT_BOT - (WIN_H + A3_STAGGER)) / 2; // 两窗整体在下半区居中
  const A3_GROW_TO = 1.14;                                 // 第二句放大的终点倍率

  // ---------- 时间轴（v7：整句入场 · 窗与幕同步渐显 · 幕间呼吸加长） ----------
  // 幕一起点 0.55 ／ 幕二 4.74 ／ 幕三 9.35 ／ 幕四 16.72
  const T = {
    a1a:0.55, a1b:1.15, a1win:0.55, a1out:3.70,
    bgD0:3.74, bgD1:4.62,
    a2a:4.74, a2b:5.34, a2win:4.74, a2out:8.20,
    a3a:9.35, a3b:9.95, a3w1:9.35, a3w2:9.80, a3grow:12.00, a3out:15.45,
    bgL0:15.50, bgL1:16.60,
    a4:16.72, a4grow:17.75, out0:19.35, out1:20.45, end:20.55
  };
  // 窗口入场时长：与整幕同步的柔渐显；渐显走完，窗内动画才开始
  const WIN_IN = 0.92;
  const DUR = T.end;

  // ---------- 缓动 ----------
  const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const easeIn  = t => t * t * t;
  const easeIO  = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;
  const seg = (t, a, b) => clamp01((t - a) / (b - a));
  const lerp = (a, b, p) => a + (b - a) * p;

  function mixColor(c1, c2, p) {
    const h = s => [parseInt(s.slice(1,3),16), parseInt(s.slice(3,5),16), parseInt(s.slice(5,7),16)];
    const A = h(c1), B = h(c2);
    return `rgb(${Math.round(lerp(A[0],B[0],p))},${Math.round(lerp(A[1],B[1],p))},${Math.round(lerp(A[2],B[2],p))})`;
  }

  function mulberry(seed){
    return function(){
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  // ---------- 文字：整句淡入（同一句共用一个 alpha，不再逐字） ----------
  function drawLine(str, cx, cy, size, color, t, t0, opts={}){
    const {dur=0.62, weight=500, alpha=1, dy=12, letter=1, ease=easeOut} = opts;
    const k = clamp01((t - t0) / dur);
    if (k <= 0.0005) return 0;
    const e = ease(k);
    const base = ctx.globalAlpha;
    ctx.save();
    ctx.font = `${weight} ${size}px -apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif`;
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    const chars = [...str];
    let total = 0;
    for (const ch of chars) total += ctx.measureText(ch).width + letter;
    total -= letter;
    let x = cx - total/2;
    const y = cy + (1 - e) * dy;
    // 整句一个 alpha —— 一起浮现，不是一个个蹦出来
    ctx.globalAlpha = base * e * alpha;
    ctx.fillStyle = color;
    for (const ch of chars) {
      ctx.fillText(ch, x, y);
      x += ctx.measureText(ch).width + letter;
    }
    ctx.restore();
    return k;
  }

  // ---------- 图形基元 ----------
  function roundRect(x, y, w, h, r){
    r = Math.min(r, w/2, h/2);
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r);
    ctx.arcTo(x, y, x+w, y, r);
    ctx.closePath();
  }
  function fillBar(x, y, w, h, color, alpha=1, r){
    if (w <= 0.6 || h <= 0.6) return;
    ctx.save();
    roundRect(x, y, w, h, r===undefined ? Math.min(h/2, 5) : r);
    ctx.fillStyle = color;
    ctx.globalAlpha *= alpha;
    ctx.fill();
    ctx.restore();
  }
  function strokePath(fn, color, width){
    ctx.save();
    ctx.beginPath(); fn();
    ctx.lineWidth = width || LW;
    ctx.strokeStyle = color;
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.stroke();
    ctx.restore();
  }
  /** 圆角山峦：两侧直坡 + 顶部小圆角，峰顶绝不是尖角 */
  function hillPath(x0, x1, yBase, yTop, r){
    const px = (x0 + x1) / 2;
    const cy = yTop + r;
    const th = 0.8;                                   // 圆角张角
    const sx = px - r * Math.sin(th), sy = cy - r * Math.cos(th);
    const ex = px + r * Math.sin(th), ey = sy;
    ctx.beginPath();
    ctx.moveTo(x0, yBase);
    ctx.lineTo(sx, sy);
    ctx.arc(px, cy, r, 3*Math.PI/2 - th, 3*Math.PI/2 + th, false);
    ctx.lineTo(x1, yBase);
    ctx.closePath();
  }
  /** 抽象风景：两道圆角山峦 + 一轮太阳（纯色块，无描边） */
  function glyphScene(cx, cy, s, cFront, cBack, cSun){
    ctx.save();
    // 太阳
    ctx.beginPath();
    ctx.arc(cx + s*0.26, cy - s*0.31, s*0.095, 0, Math.PI*2);
    ctx.fillStyle = cSun; ctx.fill();
    // 后山
    hillPath(cx - s*0.52, cx - s*0.02, cy + s*0.30, cy - s*0.26, s*0.17);
    ctx.fillStyle = cBack; ctx.fill();
    // 前山（更矮更宽）
    hillPath(cx - s*0.22, cx + s*0.50, cy + s*0.30, cy - s*0.12, s*0.15);
    ctx.fillStyle = cFront; ctx.fill();
    ctx.restore();
  }
  // ================================================================
  //  四扇窗：卡片本地坐标，线宽统一 3px，内容尽量抽象
  // ================================================================

  // ---------- 窗② 阅读：正文与表格在同一条流里一起上滑 ----------
  function drawTable(x, y, w, h){
    const rows = 2, cols = 2;               // 只留两行
    const rh = h / rows, cw = (w - LW*2) / cols;
    // 底：极浅色块
    ctx.save();
    roundRect(x, y, w, h, 8);
    ctx.fillStyle = '#EDEBE3'; ctx.fill();
    ctx.restore();
    // 外框
    ctx.save();
    roundRect(x + LW/2, y + LW/2, w - LW, h - LW, 7);
    ctx.lineWidth = LW; ctx.strokeStyle = '#D9D7CE'; ctx.stroke();
    ctx.restore();
    // 横线
    strokePath(() => {
      for (let r = 1; r < rows; r++) { const yy = y + r*rh; ctx.moveTo(x+LW/2, yy); ctx.lineTo(x+w-LW/2, yy); }
    }, '#D9D7CE', LW);
    // 竖线
    strokePath(() => {
      for (let c = 1; c < cols; c++) { const xx = x + LW/2 + c*cw; ctx.moveTo(xx, y+rh); ctx.lineTo(xx, y+h-LW/2); }
    }, '#D9D7CE', LW);
    // 单元格内容：很短的浅色条，留白充足
    const rnd = mulberry(99);
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        fillBar(x+LW/2+c*cw+8, y+r*rh+rh/2-2, cw*(0.22+rnd()*0.20), 4, r === 0 ? '#B6B4AB' : '#CAC8BF');
      }
    }
  }

  function panelReading(w, h, tw){
    ctx.fillStyle = LIGHT_BG; ctx.fillRect(0, 0, w, h);
    const pad = 11;
    // 固定标题：只留一条
    fillBar(pad, pad, 54, 6, '#4A4A51');

    // 滚动流：稀疏的浅色文字条，深浅不一
    const rnd = mulberry(4242);
    const shades = ['#C7C5BC', '#B3B1A8', '#D4D2C9', '#9E9C94'];
    const blocks = [];
    for (let i = 0; i < 4; i++) blocks.push({ t:'l', w:0.40 + rnd()*0.48, c: shades[i % 4] });
    blocks.push({ t:'tb' });
    for (let i = 0; i < 5; i++) blocks.push({ t:'l', w:0.34 + rnd()*0.52, c: shades[(i + 2) % 4] });

    const GAP = 15;
    let total = 0;
    const items = blocks.map(b => {
      const hh = b.t === 'l' ? 6 : 58;
      const o = { b, h: hh, y: total };
      total += hh + (b.t === 'tb' ? GAP*2 : GAP);
      return o;
    });

    const top = pad + 22;
    const scroll = (tw * 26) % total;
    ctx.save();
    ctx.beginPath(); ctx.rect(0, top, w, h - top); ctx.clip();
    for (let pass = 0; pass < 2; pass++) {
      for (const it of items) {
        const y = top - scroll + it.y + pass*total;
        if (y > h || y + it.h < top) continue;
        if (it.b.t === 'l') {
          fillBar(pad, y, (w-pad*2)*it.b.w, it.h, it.b.c, .92);
        } else {
          drawTable(pad, y, w-pad*2, it.h);
        }
      }
    }
    ctx.restore();
  }

  // ---------- 窗① 相册：整齐的网格 + 列间轻微错开（纯色块，无描边） ----------
  function panelAlbum(w, h, tw){
    ctx.fillStyle = '#101014'; ctx.fillRect(0, 0, w, h);
    const pad = 11;
    // 顶栏：一个圆点 + 一行文字（只有一行）
    ctx.save();
    ctx.beginPath(); ctx.arc(pad+7, pad+9, 4, 0, Math.PI*2);
    ctx.fillStyle = '#4A4A56'; ctx.fill();
    ctx.restore();
    fillBar(pad+18, pad+6, 26, 5, '#2E2E38');

    const top = pad + 22;
    const gapX = 12, gapY = 14;              // 更大的间距 → 更稀疏
    const colW = (w - pad*2 - gapX) / 2;     // 框更小
    const boxH = colW * 1.22;
    const N = 6;
    // 每列一个固定偏移：列内严格对齐，只让两列之间轻微错开
    const COL = [{ dx: 0, dy: 0 }, { dx: -4, dy: 11 }];
    const total = N*(boxH + gapY);
    for (let c = 0; c < 2; c++) {
      const x = pad + c*(colW + gapX) + COL[c].dx;
      const off = (tw * 24) % total;
      ctx.save();
      ctx.beginPath(); ctx.rect(0, top-4, w, h-top+6); ctx.clip();
      for (let pass = 0; pass < 2; pass++) {
        for (let i = 0; i < N; i++) {
          const y = top - off + i*(boxH+gapY) + pass*total + COL[c].dy;
          if (y > h || y + boxH < top-4) continue;
          // 卡片：色块，无描边
          ctx.save();
          roundRect(x, y, colW, boxH, 9);
          ctx.fillStyle = '#1A1A21'; ctx.fill();
          ctx.restore();
          // 照片：圆角山峦色块
          glyphScene(x + colW*0.5, y + boxH*0.48, Math.min(colW, boxH)*0.62,
                     '#3B3B47', '#2D2D37', '#494957');
        }
      }
      ctx.restore();
    }
  }

  // ---------- 窗③ 相机：空白取景窗 → 快门 → 闪光 → 照片（此时才出现景色） ----------
  function panelCamera(w, h, tw){
    ctx.fillStyle = '#101014'; ctx.fillRect(0, 0, w, h);
    const cycle = 3.4;
    const ph = (tw % cycle) / cycle;
    const pad = 12;
    const vx = pad, vy = pad, vw = w - pad*2, vh = h*0.58;

    // 取景窗：空白（只有一块极浅底）
    ctx.save();
    roundRect(vx, vy, vw, vh, 16);
    ctx.fillStyle = '#17171D'; ctx.fill();
    ctx.restore();
    ctx.save();
    roundRect(vx+LW/2, vy+LW/2, vw-LW, vh-LW, 15);
    ctx.lineWidth = LW; ctx.strokeStyle = '#33333E'; ctx.stroke();
    ctx.restore();

    // 快门：只保留一个圆色块（按下时收缩变淡，松开后复原）
    const press = clamp01((ph - 0.30) / 0.10) * clamp01(1 - (ph - 0.40) / 0.12);
    const r = w*0.115, scx = w/2, scy = vy + vh + w*0.30;
    ctx.save();
    ctx.globalAlpha *= 1 - press*0.55;
    ctx.beginPath(); ctx.arc(scx, scy, r * (1 - press*0.24), 0, Math.PI*2);
    ctx.fillStyle = '#EDEAE4'; ctx.fill();
    ctx.restore();

    // 照片浮起（拍完之后才出现景色）
    const pk = clamp01((ph - 0.42) / 0.42);
    if (pk > 0.001) {
      const pw = w*0.58, phh = pw*1.16;
      const px = w/2 - pw/2, py = vy + vh/2 - phh/2 + (1-easeOut(pk))*60;
      ctx.save();
      ctx.globalAlpha *= pk;
      ctx.save();
      ctx.shadowColor = 'rgba(0,0,0,.7)'; ctx.shadowBlur = 22; ctx.shadowOffsetY = 10;
      roundRect(px, py, pw, phh, 12); ctx.fillStyle = '#20202A'; ctx.fill();
      ctx.restore();
      glyphScene(px+pw*0.5, py+phh*0.5, Math.min(pw, phh)*0.62,
                 '#56566A', '#45455A', '#6C6C80');
      ctx.restore();
    }

    // 闪光：只闪白，不加星芒
    const flash = clamp01((ph - 0.31)/0.05) * clamp01(1 - (ph - 0.42)/0.22);
    if (flash > 0.002) {
      ctx.save();
      ctx.globalAlpha *= flash;
      const g = ctx.createRadialGradient(w/2, vy + vh/2, 0, w/2, vy + vh/2, w*0.86);
      g.addColorStop(0, 'rgba(255,255,255,.92)');
      g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
      ctx.restore();
    }
  }

  // ---------- 窗④ 聊天：气泡打字 + 圆角矩形键（无键盘底板） ----------
  function panelChat(w, h, tw){
    ctx.fillStyle = LIGHT_BG; ctx.fillRect(0, 0, w, h);
    const cycle = 5.0;
    const ph = (tw % cycle) / cycle;
    const pad = 12;
    const bubbles = [
      { side:'l', t:0.04, w:0.70, lines:[{w:.60},{w:.36}] },
      { side:'r', t:0.30, w:0.58, lines:[{w:.52}] },
      { side:'l', t:0.56, w:0.64, lines:[{w:.46}] }
    ];
    let y = pad + 2;
    for (const b of bubbles) {
      const k = easeOut(clamp01((ph - b.t) / 0.16));
      const bh = 16 + b.lines.length * 15;
      if (k <= 0.001) { y += bh + 14; continue; }
      const bw = (w - pad*2) * b.w;
      const x = b.side === 'l' ? pad : w - pad - bw;
      const fill = b.side === 'l' ? '#FFFFFF' : '#DEDCD3';
      ctx.save();
      ctx.globalAlpha *= k;
      ctx.translate(0, (1-k)*10);
      ctx.save();
      roundRect(x, y, bw, bh, 14);
      ctx.fillStyle = fill; ctx.fill();
      ctx.restore();
      // 小尾巴
      ctx.save();
      ctx.beginPath();
      if (b.side === 'l') { ctx.moveTo(x+8, y+bh-1); ctx.lineTo(x+1, y+bh+10); ctx.lineTo(x+22, y+bh-1); }
      else { ctx.moveTo(x+bw-8, y+bh-1); ctx.lineTo(x+bw-1, y+bh+10); ctx.lineTo(x+bw-22, y+bh-1); }
      ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
      ctx.restore();
      // 气泡里的字
      for (let i = 0; i < b.lines.length; i++) {
        const grow = easeOut(clamp01((ph - b.t - 0.12 - i*0.08) / 0.24));
        fillBar(x+12, y+9+i*15, (bw-24)*b.lines[i].w*grow, 6, '#3A3A42', .85);
      }
      ctx.restore();
      y += bh + 14;
    }

    // 键盘：不要底板，九宫格 = 9 个圆角矩形键
    const keyH = 13, gap = 8;
    const keyW = (w - pad*2 - gap*2) / 3;
    const ky = h - (keyH*3 + gap*2) - 10;
    const keyIdx = Math.floor(ph * 9) % 9;
    for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) {
      const idx = r*3 + c, on = idx === keyIdx;
      const kx = pad + c*(keyW + gap), kyy = ky + r*(keyH + gap);
      ctx.save();
      roundRect(kx, kyy, keyW, keyH, 5);
      ctx.fillStyle = on ? '#8E8C84' : '#E4E2DA'; ctx.fill();
      ctx.restore();
    }
  }

  // ---------- 小窗卡片外壳 ----------
  function drawCard(x, y, w, h, drawFn, opts={}){
    const {alpha=1, tilt=0, scale=1, bg='#FFFFFF', border='#DDDDDD', radius=24, tw=0, ph=0} = opts;
    const bob = Math.sin(tw*0.8 + ph) * 2.0;           // 轻微浮动
    const tiltJ = Math.sin(tw*0.55 + ph*1.7) * 0.007; // 轻微摆动
    ctx.save();
    ctx.globalAlpha *= alpha;
    ctx.translate(x + w/2, y + h/2 + bob);
    ctx.rotate(tilt + tiltJ);
    ctx.scale(scale, scale);
    ctx.translate(-w/2, -h/2);
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,.22)'; ctx.shadowBlur = 20; ctx.shadowOffsetY = 8;
    roundRect(0, 0, w, h, radius); ctx.fillStyle = '#000'; ctx.fill();
    ctx.restore();
    roundRect(0, 0, w, h, radius); ctx.fillStyle = bg; ctx.fill();
    ctx.save();
    roundRect(0, 0, w, h, radius); ctx.clip();
    drawFn(w, h);
    ctx.restore();
    ctx.save();
    roundRect(BW/2, BW/2, w-BW, h-BW, radius - BW/2);
    ctx.lineWidth = BW; ctx.strokeStyle = border; ctx.stroke();
    ctx.restore();
    ctx.restore();
  }

  // ---------- 小窗入场：跟着整幕一起柔和渐显，不做弹出回弹 ----------
  function winIn(t, t0){
    const k = clamp01((t - t0)/WIN_IN);
    return { a: easeIO(k), s: lerp(0.968, 1, easeOut(k)) };
  }

  // ---------- 每帧绘制：先铺满整屏，再把设计稿等比放进去 ----------
  function drawFrame(t) {
    ctx.clearRect(0, 0, VW, VH);

    // 底色：浅 → 深 → 浅（进度在 drawContent 里还要用，所以先算好）
    let bgP = 0;
    if (t >= T.bgD0 && t < T.bgD1) bgP = easeIO(seg(t, T.bgD0, T.bgD1));
    else if (t >= T.bgD1 && t < T.bgL0) bgP = 1;
    else if (t >= T.bgL0 && t < T.bgL1) bgP = 1 - easeIO(seg(t, T.bgL0, T.bgL1));

    // 1) 整屏底色（含等比缩放后的留白区，避免出现黑边）
    ctx.fillStyle = mixColor(LIGHT_BG, DARK_BG, bgP);
    ctx.fillRect(0, 0, VW, VH);

    // 2) 设计稿内容：取小的那个比例，居中
    const sc = Math.min(VW / W, VH / H);
    const ox = (VW - W * sc) / 2, oy = (VH - H * sc) / 2;
    ctx.save();
    ctx.translate(ox, oy);
    ctx.scale(sc, sc);
    drawContent(t, bgP);
    ctx.restore();

    // 3) 收尾：整屏淡到米白（同样铺满，边缘不能露底）
    if (t > T.out0) {
      const k = easeIO(seg(t, T.out0, T.out1));
      ctx.fillStyle = `rgba(244,243,239,${k})`;
      ctx.fillRect(0, 0, VW, VH);
    }
  }

  function drawContent(t, bgP) {
    const ink  = mixColor(LIGHT_INK, DARK_INK, bgP);
    const sub  = mixColor(LIGHT_SUB, DARK_SUB, bgP);
    const fade = (t0, t1) => 1 - easeIn(seg(t, t0, t1));

    // ===== 第一幕：光 + 阅读窗 =====
    if (t < T.a1out + 0.5) {
      const a = fade(T.a1out, T.a1out + 0.5);
      ctx.save(); ctx.globalAlpha = a;
      // 第一句：与整幕（窗口）同步渐显 —— 同起点、同时长、同曲线
      drawLine('白天 沐浴光里', W/2, 268, FS, ink, t, T.a1a, {weight:500, letter:1, dur:WIN_IN, ease:easeIO});
      // 第二句：0.75s 渐显
      drawLine('要的就是效率', W/2, 320, FS, sub, t, T.a1b, {weight:400, letter:1, dur:0.75, ease:easeIO});
      ctx.restore();
    }
    if (t >= T.a1win && t < T.a1out + 0.5) {
      const inS = winIn(t, T.a1win);
      const outA = 1 - easeIn(seg(t, T.a1out + 0.05, T.a1out + 0.45));
      const alpha = inS.a * outA;
      const tw = Math.max(0, t - T.a1win - WIN_IN);   // 渐显走完才开始动
      if (alpha > 0.003) {
        drawCard(WIN_X, WIN1_Y, WIN_W, WIN_H, (w,h) => panelReading(w, h, tw),
                 { alpha, scale: inS.s, tilt: -0.045, bg: LIGHT_BG, border: '#E1DFD6',
                   tw, ph: 0 });
      }
    }

    // ===== 第二幕：暗 + 相册窗 =====
    if (t > T.a2a - 0.3 && t < T.a2out + 0.5) {
      const a = t < T.a2out ? 1 : fade(T.a2out, T.a2out + 0.5);
      ctx.save(); ctx.globalAlpha = a;
      drawLine('而映像 要在暗处', W/2, 268, FS, ink, t, T.a2a, {weight:500, letter:1, dur:WIN_IN, ease:easeIO});
      drawLine('方显作者本意', W/2, 320, FS, sub, t, T.a2b, {weight:400, letter:1, dur:0.75, ease:easeIO});
      ctx.restore();
    }
    if (t >= T.a2win && t < T.a2out + 0.5) {
      const inS = winIn(t, T.a2win);
      const outA = 1 - easeIn(seg(t, T.a2out + 0.05, T.a2out + 0.45));
      const alpha = inS.a * outA;
      const tw = Math.max(0, t - T.a2win - WIN_IN);
      if (alpha > 0.003) {
        drawCard(WIN_X, WIN1_Y, WIN_W, WIN_H, (w,h) => panelAlbum(w, h, tw),
                 { alpha, scale: inS.s, tilt: 0.045, bg: '#101014', border: '#2E2E38',
                   tw, ph: 1.2 });
      }
    }

    // ===== 第三幕：各归各位 + 相机窗 & 聊天窗 =====
    if (t > T.a3a - 0.3 && t < T.a3out + 0.5) {
      const a = t < T.a3out ? 1 : fade(T.a3out, T.a3out + 0.5);
      ctx.save(); ctx.globalAlpha = a;
      drawLine('让每个 APP', W/2, 252, FS, ink, t, T.a3a, {weight:500, letter:1, dur:WIN_IN, ease:easeIO});
      // 第二句：像第四幕一样，静静放大（速率不变，终点更大）
      const g3 = clamp01((t - T.a3grow) / (T.a3out - T.a3grow));
      const s3 = lerp(1, A3_GROW_TO, easeIO(g3));
      ctx.save();
      ctx.translate(W/2, 304); ctx.scale(s3, s3); ctx.translate(-W/2, -304);
      drawLine('各归各的深浅', W/2, 304, FS, ink, t, T.a3b, {weight:500, letter:1, dur:0.75, ease:easeIO});
      ctx.restore();
      ctx.restore();
    }
    // 相机窗（左）
    if (t >= T.a3w1 && t < T.a3out + 0.5) {
      const inS = winIn(t, T.a3w1);
      const outA = 1 - easeIn(seg(t, T.a3out + 0.05, T.a3out + 0.45));
      const alpha = inS.a * outA;
      const tw = Math.max(0, t - T.a3w1 - WIN_IN);
      if (alpha > 0.003) {
        drawCard(A3_X, A3_Y, WIN_W, WIN_H, (w,h) => panelCamera(w, h, tw),
                 { alpha, scale: inS.s, tilt: -0.045, bg: '#101014', border: '#2E2E38',
                   tw, ph: 2.4 });
      }
    }
    // 聊天窗（右）
    if (t >= T.a3w2 && t < T.a3out + 0.5) {
      const inS = winIn(t, T.a3w2);
      const outA = 1 - easeIn(seg(t, T.a3out + 0.05, T.a3out + 0.45));
      const alpha = inS.a * outA;
      const tw = Math.max(0, t - T.a3w2 - WIN_IN);
      if (alpha > 0.003) {
        drawCard(A3_X + WIN_W + A3_GAP, A3_Y + A3_STAGGER, WIN_W, WIN_H, (w,h) => panelChat(w, h, tw),
                 { alpha, scale: inS.s, tilt: 0.045, bg: LIGHT_BG, border: '#E1DFD6',
                   tw, ph: 3.6 });
      }
    }

    // ===== 第四幕：只留名字（出现后缓缓放大，再淡出） =====
    if (t > T.a4 - 0.3) {
      const app = clamp01((t - T.a4) / 0.9);
      const grow = clamp01((t - T.a4grow) / 1.5);
      const alpha = easeOut(app) * (1 - seg(t, T.out0, T.out0 + 0.5));
      const s = lerp(0.94, 1.0, easeOut(app)) * lerp(1, 1.07, easeIO(grow));
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(W/2, 424); ctx.scale(s, s); ctx.translate(-W/2, -424);
      ctx.fillStyle = LIGHT_INK;
      ctx.font = `600 40px -apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      ctx.fillText('AnyNight', W/2, 424);
      ctx.restore();
    }
  }

  
  // ---------- 播放器 ----------
  let tNow = 0, playing = false, last = 0, ended = false, booted = false;
  const tapEl = document.getElementById('tap');

  function render(){ drawFrame(tNow); }

  function loop(now){
    if (!last) last = now;
    const dt = Math.min((now - last) / 1000, 0.05);   // 切后台回来不要一次跳很多
    last = now;
    if (playing){
      tNow += dt;
      if (tNow >= DUR){
        tNow = DUR; playing = false; ended = true;
        setTimeout(() => tapEl.classList.add('show'), 700);
      }
    }
    drawFrame(tNow);
    requestAnimationFrame(loop);
  }

  // 微信里能拿到的全屏：Android（X5/XWeb）支持 requestFullscreen；iOS 没有这个 API，
  // 只能靠铺满视口 + 页面自身的布局（下面的 meta 已经在尽量压掉工具栏）。
  function goFullscreen(){
    const el = document.documentElement;
    const f = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if (f){
      try { f.call(el, { navigationUI: 'hide' }); }
      catch (e) { try { f.call(el); } catch (_) {} }
    }
    try {
      if (screen.orientation && screen.orientation.lock) screen.orientation.lock('portrait').catch(() => {});
    } catch (_) {}
  }

  function start(){
    goFullscreen();                 // 必须在用户手势里调，否则被拦
    tapEl.classList.remove('show');
    tNow = 0; last = 0; playing = true; ended = false; booted = true;
  }

  tapEl.addEventListener('click', start);
  tapEl.addEventListener('touchstart', e => { e.preventDefault(); start(); }, { passive: false });

  // 调试用：?t=秒 定格到某一帧（不影响正常打开），也给离线导帧用
  const q = new URLSearchParams(location.search);
  window.__seek = s => { tNow = Math.min(DUR, Math.max(0, s)); playing = false; drawFrame(tNow); };
  if (q.has('t')) window.__seek(parseFloat(q.get('t')) || 0);
  if (q.get('still') === '1') { window.__seek(0); }

  document.addEventListener('visibilitychange', () => { last = 0; });
  window.addEventListener('resize', () => { layout(); last = 0; });
  window.addEventListener('orientationchange', () => setTimeout(() => { layout(); last = 0; }, 150));
  if (window.visualViewport) window.visualViewport.addEventListener('resize', () => layout());

  layout();
  render();
  if (q.get('still') !== '1') tapEl.classList.add('show');   // 首屏：纸色 + 一个很淡的播放标记
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
